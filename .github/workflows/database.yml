name: Disposable database checks
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "tests/**"
      - "scripts/test-database.ts"
      - "src/lib/backups/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:database
